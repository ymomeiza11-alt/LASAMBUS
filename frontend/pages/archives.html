<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LASAMBUS — Archives</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/global.css" />
</head>
<body>
  <div class="lasambus-layout">
    <div id="header-placeholder"></div>
    <div id="sidebar-placeholder"></div>

    <main class="lasambus-main">
      <h1 class="page-title">Archives</h1>

      <div class="card">
        <div class="flex justify-between align-center mb-16" style="flex-wrap:wrap; gap:12px;">
          <input type="text" id="archive-title-input" placeholder="Title (optional)" style="max-width:260px;" />
          <div>
            <input type="file" id="archive-upload-input" accept="image/*" multiple class="hidden" onchange="uploadArchivePhotos()" />
            <button class="btn btn-primary" onclick="document.getElementById('archive-upload-input').click()">
              <i class="bi bi-camera"></i> Upload Photo(s)
            </button>
          </div>
        </div>

        <div id="archive-gallery" class="photo-gallery">
          <p style="color:#888; font-style:italic;">No archived photos yet.</p>
        </div>
      </div>
    </main>

    <div id="footer-placeholder"></div>
  </div>

  <script src="../js/components.js"></script>
  <script src="../js/archives.js"></script>
</body>
</html>
